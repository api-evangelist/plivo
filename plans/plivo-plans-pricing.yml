specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Plivo
providerId: plivo
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
  - Communications
  - CPaaS
  - Voice
  - SMS
  - Messaging
  - Plans
description: >-
  Plivo follows a usage-based, pay-as-you-go pricing model with no contract or lock-in. New accounts receive $10 of free trial credit. Charges accrue per outbound/inbound SMS segment, per voice minute (60-second billing increment), per number rental, and per add-on service (Verify, Lookup, MMS, WhatsApp, AI Voice Agent). Higher-volume customers can move to enterprise plans starting at approximately $1,000/month for committed-use discounts.
notes: >-
  Reconciled against https://www.plivo.com/pricing/ on 2026-05-08. Rates shown are US prices; per-country rates are returned dynamically by the Plivo Pricing API. Plivo also offers volume discounts and a separate AI Voice Agent platform whose pricing varies by deployment.
sources:
  - https://www.plivo.com/pricing/
  - https://www.plivo.com/sms/pricing/
  - https://www.plivo.com/voice/pricing/
plans:
  - id: plivo-trial
    name: Free Trial Credit
    type: free
    description: >-
      New Plivo accounts receive $10 in free credit, no credit card required. Trial accounts may only call/SMS verified destinations and have throughput restrictions until a payment method is added.
    entries:
      - label: Trial Credit
        name: trial_credit
        type: flat
        metric: account
        limit: 1
        timeFrame: lifetime
        geo: global
        unit: 1
        price: 0
        currency: USD
        userMultiplied: false
    elements:
      - name: Verified-Destinations Only
      - name: Reduced Throughput
      - name: Full API Access
  - id: plivo-pay-as-you-go
    name: Pay-As-You-Go
    type: usage
    description: >-
      Plivo's standard self-serve tier bills monthly in arrears at the published per-message and per-minute rates.
    entries:
      - label: SMS Long Code (US)
        name: sms_longcode_us
        type: per_unit
        metric: message
        unit: 1
        timeFrame: usage
        geo: US
        price: 0.0077
        currency: USD
        direction: both
      - label: SMS Toll-Free (US)
        name: sms_tollfree_us
        type: per_unit
        metric: message
        unit: 1
        timeFrame: usage
        geo: US
        price: 0.0079
        currency: USD
        direction: both
      - label: Voice Local Outbound (US)
        name: voice_local_outbound_us
        type: per_unit
        metric: minute
        unit: 1
        timeFrame: usage
        geo: US
        price: 0.0115
        currency: USD
        direction: outbound
      - label: Voice Local Inbound (US)
        name: voice_local_inbound_us
        type: per_unit
        metric: minute
        unit: 1
        timeFrame: usage
        geo: US
        price: 0.0055
        currency: USD
        direction: inbound
      - label: Voice Toll-Free Outbound (US)
        name: voice_tollfree_outbound_us
        type: per_unit
        metric: minute
        unit: 1
        timeFrame: usage
        geo: US
        price: 0.0060
        currency: USD
        direction: outbound
      - label: Voice Toll-Free Inbound (US)
        name: voice_tollfree_inbound_us
        type: per_unit
        metric: minute
        unit: 1
        timeFrame: usage
        geo: US
        price: 0.0180
        currency: USD
        direction: inbound
      - label: Browser SDK / SIP (US)
        name: voice_browser_sip_us
        type: per_unit
        metric: minute
        unit: 1
        timeFrame: usage
        geo: US
        price: 0.0033
        currency: USD
        direction: both
    elements:
      - name: 60-Second Voice Billing Increment
      - name: Per-Country Rate Card via Pricing API
      - name: Volume Discounts Available
  - id: plivo-enterprise
    name: Enterprise
    type: enterprise
    description: >-
      Enterprise plans for higher-volume customers begin at approximately $1,000/month, providing volume discounts, committed-use rates, dedicated infrastructure, premium support, and custom contractual terms.
    entries:
      - label: Minimum Monthly Commitment (starting)
        name: minimum_monthly
        type: flat
        metric: account
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: 1000
        currency: USD
        userMultiplied: false
    elements:
      - name: Volume Discount on SMS / Voice
      - name: Premium Support / SLA
      - name: Dedicated Infrastructure (Optional)
      - name: Custom Contracts
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
